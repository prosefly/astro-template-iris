- id: elliot-reed
  name: Elliot Reed
  avatar: /people/elliot-reed.webp
  role: Writer & observer
  bio: >-
    Elliot writes about ordinary places and the small things that make them
    worth noticing. His work explores walking, attention, and the stories
    hiding in the everyday.

- id: maya-chen
  name: Maya Chen
  avatar: /people/maya-chen.webp
  role: Designer & maker
  bio: >-
    Maya is a designer interested in the quieter side of creative practice.
    She makes objects and experiments that leave room for rest, play, and
    finding a rhythm of your own.

- id: june-park
  name: June Park
  avatar: /people/june-park.webp
  role: Artist & community builder
  bio: >-
    June brings people together through art, shared tables, and unfinished
    ideas. Her practice asks how a space can feel welcoming before it feels
    complete.

- id: sam-rivera
  name: Sam Rivera
  avatar: /people/sam-rivera.webp
  role: Photographer & wanderer
  bio: >-
    Sam is a photographer drawn to slow journeys and the details between
    destinations. His work follows the relationship between ambition,
    attention, and choosing a life that feels like your own.
